workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Create Android directory
        script: flutter create . --platforms=android

      - name: Add Internet permission
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if '<manifest ' in line:
                      lines.insert(i + 1, '    ' + permission)
                      break
              manifest.write_text('\n'.join(lines) + '\n')

          print("Internet permission configured successfully.")
          PY

      - name: Set app name
      script: |
    sed -i 's/android:label="[^"]*"/android:label="TalkGPT"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

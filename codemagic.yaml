workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Create Android directory
        script: flutter create . --platforms=android

      - name: Add permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>',
              '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>'
          ]

          lines = text.splitlines()
          new_perms = [p for p in permissions if p not in text]
          if new_perms:
              for i, line in enumerate(lines):
                  if '<manifest ' in line:
                      for j, p in enumerate(new_perms):
                          lines.insert(i + 1 + j, '    ' + p)
                      break
              manifest.write_text('\n'.join(lines) + '\n')

          print("Permissions configured successfully.")
          PY

      - name: Get dependencies
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

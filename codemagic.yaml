workflows:
android-workflow:
name: Android Build
instance_type: mac_mini_m2
max_build_duration: 60
environment:
flutter: stable
java: 17
scripts:
- name: Create Android directory
script: |
flutter create . --platforms=android
- name: Get dependencies
script: |
flutter pub get
- name: Build APK
script: |
flutter build apk --release
artifacts:
- build/app/outputs/flutter-apk/app-release.apk
